<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutoring</title>
<style>
:root{--ink:#14284b;--mut:#51607a;--paper:#f3f8fb;--grid:#d9e5ee;--mark:#ffd23f;--ok:#1b8a6b;--off:#c5cdd8;--edit:#e4572e}
*{box-sizing:border-box}
body{margin:0;font:16px/1.65 system-ui,sans-serif;color:var(--ink);background:var(--paper) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;line-height:1.2}
h1{font-size:clamp(2rem,5vw,3.2rem);margin:.1em 0 .3em}
h1 span,h2 span{background:linear-gradient(transparent 55%,var(--mark) 55%)}
nav{position:fixed;top:0;right:0;width:220px;height:100%;background:#fff;border-left:3px solid var(--ink);padding:20px 14px;display:flex;flex-direction:column;gap:2px;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font:700 1.1rem Georgia,serif;margin-bottom:16px}
.logo img{height:40px}
nav a{padding:9px 12px;color:var(--ink);text-decoration:none;border-left:4px solid transparent}
nav a:hover{background:var(--paper)}nav a.on{border-color:var(--mark);background:var(--paper);font-weight:700}
main{margin-right:220px;padding:32px;max-width:980px}
#burger{display:none}
section{display:none}section.on{display:block}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
.hero>div{flex:1 1 320px}.hero img{max-width:280px;border:3px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chips b{border:2px solid var(--ink);background:#fff;padding:2px 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin:20px 0}
.box{background:#fff;border:2px solid var(--ink);padding:16px 18px}
a.box{display:block;color:inherit;text-decoration:none;box-shadow:5px 5px 0 var(--mark)}
a.box:hover{box-shadow:5px 5px 0 var(--ink)}
.ico{font-size:2rem;line-height:1}
.quote{border-left:6px solid var(--mark)}
.edit{outline:2px dashed var(--edit);background:#fff1ec;padding:0 4px}
button,.btn{background:var(--ink);color:#fff;border:0;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#27447c}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
button.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
input,textarea{width:100%;padding:10px;border:2px solid var(--ink);font:inherit;margin:4px 0 14px;background:#fff}
label{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab.on{background:var(--mark);color:var(--ink)}
.grp{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);padding:4px;background:#fff}
.grp i{color:var(--mut);font-size:.85rem}
.slot{background:#fff;color:var(--ink);border:2px solid var(--ok);padding:6px 12px}
.slot:hover,.slot.sel{background:var(--ok);color:#fff}
.slot:disabled{border-color:var(--off);color:var(--off);background:#f0f2f5;text-decoration:line-through;cursor:not-allowed}
.price{font:700 3rem Georgia,serif}
.msg{font-weight:600;color:var(--ok)}
#viewer{position:fixed;inset:0;background:rgba(20,40,75,.9);z-index:20;padding:16px;display:flex;flex-direction:column;gap:8px}
#viewer[hidden]{display:none}
#viewer iframe{flex:1;border:0;background:#fff}
@media(max-width:800px){
nav{transform:translateX(100%);transition:transform .2s}nav.open{transform:none}
main{margin:0;padding:64px 16px 24px}
#burger{display:block;position:fixed;top:10px;right:10px;z-index:6}}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
</style></head><body>
<button id="burger" aria-label="Menu">☰ Menu</button>
<nav id="nav"></nav>
<main id="main"></main>
<div id="viewer" hidden><div><button id="vclose">Close</button></div><iframe id="pdf" title="Document"></iframe></div>

<script>
/* ============================================================
   ✎ SETTINGS – everything you may want to change is in here.
   Yellow-dashed/orange text on the site = a placeholder "[…]"
   that you should replace (set highlightEditable:false to
   turn the orange marking off).
   ============================================================ */
const CONFIG = {
  brand: "Your Tutoring",                     // ✎ name of your tutoring
  email: "you@example.com",                   // ✎ where messages should go
  logo: "images/logo.png",                    // ✎ replace the file in /images to change the logo
  hero: "images/hero.jpg",                    // ✎ big picture on the start page
  tagline: "One-to-one tutoring for teenagers in science, maths and more. [✎ Add your own short welcome sentence]",
  highlightEditable: true,
  formEndpoint: "",   // ✎ optional: a Formspree URL, so messages/bookings arrive by e-mail. Empty = opens the visitor’s e-mail app.
  backendUrl: "",     // ✎ optional: shared booking storage (see README note). Empty = demo mode, bookings only saved in this browser.
  passwordHash: "",   // ✎ SHA-256 of your password. In the browser console run: hashPw("mypassword").then(console.log)

  about: {
    bullets: [
      "Main subject: [✎ your main subject]",
      "Interests: [✎ your interests]",
      "Knowledge and education: [✎ degrees, courses, skills]",
      "Grades: [✎ add your grades, e.g. Maths 6.0]",
      "Teaching experience: [✎ years, age groups]"
    ],
    free: "[✎ Add anything else you would like to say about yourself]"
  },

  reviews: [   // ✎ feedback from customers
    { name: "[✎ Name, e.g. Parent of a 9th grader]", text: "[✎ Feedback text]" },
    { name: "[✎ Name]", text: "[✎ Feedback text]" },
    { name: "[✎ Name]", text: "[✎ Feedback text]" }
  ],

  // ✎ PDFs: put the files into the folder pdfs/ and list them here.
  // Example: { title: "Mechanics", file: "pdfs/physics/theory-mechanics.pdf" }
  subjects: [
    ["physics", "Physics", "⚛️"], ["maths", "Maths", "📐"], ["cs", "Computer science", "💻"],
    ["chemistry", "Chemistry", "🧪"], ["biology", "Biology", "🧬"],
    ["geography", "Geography", "🌍"], ["history", "History", "🏛️"]
  ].map(([id, name, icon]) => ({
    id, name, icon,
    theory: [], exercises: [], solutions: [], exams: []
  })),

  prices: {
    perLesson: 25, currency: "CHF",
    points: [
      "Standard option: lessons are counted and you receive a bill every 2–4 weeks.",
      "Every 10th lesson is free (the count resets to zero at the end of the year).",
      "I reply within 24 hours during the week.",
      "One-to-one tutoring: enough time for every student.",
      "Free access to the material (theory, exercises with solutions, old exams) for everyone with at least one lesson per week.",
      "[✎ Add more things you offer]"
    ]
  },

  // Bookable slots. Weekday: 1 = Monday … 5 = Friday. Two times in one group = “or” (only one can be booked).
  slots: {
    1: [["13:30–14:15"], ["14:20–15:05"], ["15:15–16:00"], ["16:05–16:50"], ["16:55–17:40"]],
    2: [["11:50–12:35", "12:40–13:25"], ["16:55–17:40"]],
    3: [["11:50–12:35", "12:40–13:25"], ["15:15–16:00"], ["16:05–16:50"], ["16:55–17:40"]],
    4: [],
    5: [["16:05–16:50"], ["16:55–17:40"]]
  }
};

/* ===================== from here on: the program ===================== */
const $ = s => document.querySelector(s);
const E = t => CONFIG.highlightEditable && /\[.*\]/.test(t) ? t.replace(/\[[^\]]*\]/g, m => `<span class="edit">${m}</span>`) : t;
const img = (src, alt = "") => `<img src="${src}" alt="${alt}" onerror="this.remove()">`;
const PAGES = [
  { id: "home", name: "Home", icon: "🏠" },
  { id: "about", name: "About me", icon: "👋", blurb: "Who I am and what I know" },
  { id: "contact", name: "Contact", icon: "✉️", blurb: "Ask me a question" },
  { id: "subjects", name: "Subjects", icon: "🔒", blurb: "Material for my students" },
  { id: "prices", name: "Prices", icon: "💳", blurb: "What a lesson costs" },
  { id: "booking", name: "Book a lesson", icon: "📅", blurb: "Pick a free time slot" }
];
const PARTS = [["theory", "Theory", "📖"], ["exercises", "Exercises", "✏️"], ["solutions", "Solutions", "✅"], ["exams", "Old exams", "📝"]];

document.title = CONFIG.brand;
$("#nav").innerHTML = `<div class="logo">${img(CONFIG.logo, "")}<span>${CONFIG.brand}</span></div>` +
  PAGES.map(p => `<a href="#${p.id}">${p.icon} ${p.name}</a>`).join("");

$("#main").innerHTML = `
<section id="home">
  <div class="hero"><div>
    <h1><span>${CONFIG.brand}</span></h1><p>${E(CONFIG.tagline)}</p>
    <div class="chips">${CONFIG.subjects.map(s => `<b>${s.icon} ${s.name}</b>`).join("")}</div>
    <a class="btn" href="#booking">Book a lesson</a>
  </div>${img(CONFIG.hero)}</div>
  <div class="grid">${PAGES.slice(1).map(p => `<a class="box" href="#${p.id}"><div class="ico">${p.icon}</div><b>${p.name}</b><div>${p.blurb}</div></a>`).join("")}</div>
  <h2><span>What others say</span></h2>
  <div class="grid">${CONFIG.reviews.map(r => `<div class="box quote"><p>“${E(r.text)}”</p><b>${E(r.name)}</b></div>`).join("")}</div>
</section>

<section id="about"><h2><span>About me</span></h2>
  <div class="box"><ul>${CONFIG.about.bullets.map(b => `<li>${E(b)}</li>`).join("")}</ul></div>
  <h3>More about me</h3><div class="box">${E(CONFIG.about.free)}</div>
</section>

<section id="contact"><h2><span>Ask me a question</span></h2>
  <form id="cform" class="box">
    <label for="cn">Your name</label><input id="cn" name="name" required>
    <label for="ce">Your e-mail address</label><input id="ce" name="email" type="email" required>
    <label for="cm">Your message</label><textarea id="cm" name="message" rows="5" required></textarea>
    <button>Send message</button> <span id="cmsg" class="msg"></span>
  </form>
</section>

<section id="subjects"><h2><span>Subject material</span></h2><div id="subjbox"></div></section>

<section id="prices"><h2><span>Prices</span></h2>
  <div class="box"><div class="price">${CONFIG.prices.perLesson} ${CONFIG.prices.currency}</div>per lesson (45 minutes)
  <ul>${CONFIG.prices.points.map(p => `<li>${E(p)}</li>`).join("")}</ul></div>
</section>

<section id="booking"><h2><span>Book a lesson</span></h2>
  <div class="box">
    <label for="date">Choose a day</label><input id="date" type="date" style="max-width:240px">
    <div id="slots" class="row"></div>
    <form id="bform" hidden>
      <p><b id="bsel"></b></p>
      <label for="bn">Your full name</label><input id="bn" name="name" required>
      <label for="be">Your e-mail address</label><input id="be" name="email" type="email" required>
      <label for="bm">Message (optional)</label><textarea id="bm" name="msg" rows="3"></textarea>
      <p><label><input type="checkbox" name="weekly" style="width:auto;margin:0 8px 0 0">Weekly lesson: reserve this time slot every week</label></p>
      <button>Book this lesson</button>
    </form>
    <p id="bmsg" class="msg"></p>
  </div>
</section>`;

/* ---------- menu / routing ---------- */
function go() {
  const id = PAGES.some(p => "#" + p.id === location.hash) ? location.hash.slice(1) : "home";
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.hash === "#" + id));
  $("#nav").classList.remove("open"); scrollTo(0, 0);
}
addEventListener("hashchange", go); go();
$("#burger").onclick = () => $("#nav").classList.toggle("open");

/* ---------- sending (e-mail service or e-mail app) ---------- */
async function post(data, subject) {
  if (!CONFIG.formEndpoint) return false;
  try {
    const r = await fetch(CONFIG.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ _subject: subject, ...data }) });
    return r.ok;
  } catch (e) { return false; }
}
$("#cform").onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  if (await post(d, "Question from " + d.name)) { $("#cmsg").textContent = "Thank you! I will answer within 24 hours."; e.target.reset(); }
  else location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent("Question from " + d.name)}&body=${encodeURIComponent(d.message + "\n\n" + d.name + " (" + d.email + ")")}`;
};

/* ---------- password-protected subjects ---------- */
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
window.hashPw = sha;
function renderSubjects() {
  const box = $("#subjbox");
  if (sessionStorage.unlocked !== "1") {
    box.innerHTML = `<form id="pform" class="box" style="max-width:380px"><p>This area is for my students. Enter the password you received from me.</p>
      <label for="pw">Password</label><input id="pw" type="password" required><button>Open</button> <span id="pmsg" class="msg" style="color:#b3261e"></span></form>`;
    $("#pform").onsubmit = async e => {
      e.preventDefault();
      if (!CONFIG.passwordHash) { $("#pmsg").textContent = "No password has been set yet."; return; }
      if (await sha($("#pw").value) === CONFIG.passwordHash) { sessionStorage.unlocked = "1"; renderSubjects(); }
      else $("#pmsg").textContent = "Wrong password. Try again.";
    };
    return;
  }
  box.innerHTML = `<div class="row">${CONFIG.subjects.map((s, i) => `<button class="alt tab" data-i="${i}">${s.icon} ${s.name}</button>`).join("")}</div><div id="subj"></div>`;
  const show = i => {
    const s = CONFIG.subjects[i];
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", +t.dataset.i === i));
    $("#subj").innerHTML = `<div class="grid">${PARTS.map(([k, n, ic]) => `<div class="box"><h3>${ic} ${n}</h3>${
      s[k].length ? s[k].map(f => `<div class="row"><button class="alt" data-file="${f.file}">${f.title}</button></div>`).join("") : "<p>Nothing uploaded yet.</p>"}</div>`).join("")}</div>`;
  };
  box.querySelectorAll(".tab").forEach(t => t.onclick = () => show(+t.dataset.i));
  show(0);
}
renderSubjects();
$("#subjbox").addEventListener("click", e => {
  const f = e.target.dataset.file; if (!f) return;
  $("#pdf").src = f + "#toolbar=0&navpanes=0"; $("#viewer").hidden = false;   // opens in the browser only, no download button
});
$("#vclose").onclick = () => { $("#viewer").hidden = true; $("#pdf").src = "about:blank"; };
$("#viewer").oncontextmenu = e => e.preventDefault();

/* ---------- booking ---------- */
const api = {   // ✎ with backendUrl set, bookings are shared by all visitors (GET = list, POST = add)
  async list() {
    if (CONFIG.backendUrl) { try { return await (await fetch(CONFIG.backendUrl)).json(); } catch (e) { return []; } }
    return JSON.parse(localStorage.getItem("bookings") || "[]");
  },
  async add(b) {
    if (CONFIG.backendUrl) { await fetch(CONFIG.backendUrl, { method: "POST", body: JSON.stringify(b) }); return; }
    const l = JSON.parse(localStorage.getItem("bookings") || "[]"); l.push(b); localStorage.setItem("bookings", JSON.stringify(l));
  }
};
const taken = (list, date, group) => list.some(b => b.group === group && (b.weekly ? date >= b.date : b.date === date));
let sel = null;
$("#date").min = new Date().toISOString().slice(0, 10);

async function showSlots() {
  const v = $("#date").value, box = $("#slots"); sel = null; $("#bform").hidden = true; $("#bmsg").textContent = "";
  if (!v) { box.innerHTML = ""; return; }
  const day = new Date(v + "T12:00").getDay(), groups = CONFIG.slots[day] || [];
  if (!groups.length) { box.innerHTML = "<p>No lessons are possible on this day. Please choose another day.</p>"; return; }
  const list = await api.list();
  box.innerHTML = groups.map((g, gi) => {
    const off = taken(list, v, day + "-" + gi);
    return `<div class="grp">${g.map(t => `<button class="slot" ${off ? "disabled" : ""} data-g="${day}-${gi}" data-t="${t}">${t}</button>`).join("<i>or</i>")}</div>`;
  }).join("");
}
$("#date").onchange = showSlots;
$("#slots").onclick = e => {
  const b = e.target.closest(".slot"); if (!b || b.disabled) return;
  document.querySelectorAll(".slot").forEach(x => x.classList.remove("sel")); b.classList.add("sel");
  sel = { g: b.dataset.g, t: b.dataset.t };
  $("#bsel").textContent = `${$("#date").value}, ${sel.t}`; $("#bform").hidden = false;
};
$("#bform").onsubmit = async e => {
  e.preventDefault();
  const v = $("#date").value, f = new FormData(e.target);
  if (taken(await api.list(), v, sel.g)) { alert("Sorry, this time slot was just booked by someone else."); return showSlots(); }
  const b = { date: v, group: sel.g, time: sel.t, weekly: f.get("weekly") === "on", name: f.get("name"), email: f.get("email"), msg: f.get("msg") };
  await api.add(b); post(b, "New booking: " + v + " " + sel.t);
  e.target.reset(); await showSlots();
  $("#bmsg").textContent = `Booked: ${v}, ${b.time}${b.weekly ? " (every week)" : ""}. Thank you, ${b.name}!`;
};
</script></body></html>
