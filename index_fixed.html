<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutoring</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202e;--p:#1f3a5f;--tint:#dde5ef;--light:#f0f3f7;--line:#cdd5df;--sand:#d8cfb8;--rev:#eceff4;--mut:#4b5b70;--off:#c5cdd8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
a{color:inherit}
h1,h2,h3{line-height:1.15}
h1{margin:0 0 20px;font-size:clamp(2.2rem,5vw,4rem);font-weight:800}
h2{margin:0 0 24px;font-size:clamp(1.7rem,3vw,2.3rem);font-weight:800}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:0 max(24px,calc((100% - 1180px)/2));min-height:72px}
.logo{display:flex;align-items:center;gap:10px;font-size:1.35rem;font-weight:800;color:var(--p)}
.logo img{height:40px}
.links a{margin-left:22px;font-weight:600;font-size:15px;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.links a:hover,.links a.on{border-color:var(--p);color:var(--p)}
#burger{display:none}
section{display:none}section.on{display:block}
section:not(#home){max-width:1180px;margin:0 auto;padding:48px 24px 72px}
.w{max-width:1180px;margin:0 auto;padding:0 24px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:48px;align-items:center}
.kick{margin:0 0 12px;color:var(--p);font-weight:600}
.lead{font-size:1.2rem;max-width:480px}
.art{position:relative;height:430px}
.dot{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ic{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ph{background:var(--tint);color:var(--p);border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:600;text-align:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.bg{background:var(--light);padding:64px 0}
.sec{padding:72px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.t{background:#fff;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;color:var(--p)}
.t b{color:var(--ink);font-size:1.1rem}
.c{border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:6px;text-decoration:none;background:#fff}
.c b{font-size:1.2rem}.c:hover{border-color:var(--p)}
.q{background:var(--rev);border-radius:20px;padding:28px}
.q p{font-size:1.1rem;margin:0 0 14px}
ul{font-size:1.1rem}li{margin-bottom:10px}
details{border-bottom:1px solid var(--line);padding:16px 0;font-size:1.1rem}summary{font-weight:600;cursor:pointer}
.foot{background:var(--ink);color:#e2e8f0;padding:40px 24px;text-align:center}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.edit{outline:2px dashed #c2410c;background:#fff1ec;padding:0 4px}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:999px;padding:12px 26px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#2b4d7c}
.btn.lg{padding:20px 48px;font-size:1.25rem}
button.alt{background:#fff;color:var(--p);border:2px solid var(--p)}
button.alt:hover{background:var(--tint)}
:is(button,a,input,textarea,summary):focus-visible{outline:3px solid #7da2d6;outline-offset:2px}
input,textarea{width:100%;padding:11px;border:1px solid #9aa8bb;border-radius:10px;font:inherit;margin:4px 0 14px;background:#fff}
label{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab.on{background:var(--tint)}
.grp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px;background:#fff}
.grp i{color:var(--mut);font-size:.85rem}
.slot{background:#fff;color:var(--p);border:2px solid var(--p);padding:6px 14px}
.slot:hover,.slot.sel{background:var(--p);color:#fff}
.slot:disabled{border-color:var(--off);color:#8a96a8;background:#f0f2f5;text-decoration:line-through;cursor:not-allowed}
.price{font-size:3rem;font-weight:800;color:var(--p)}
.msg{font-weight:600;color:var(--p)}
.small{font-size:.85rem;color:var(--mut)}
.about{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.photo{width:210px;min-height:210px;border:1px solid var(--line);border-radius:16px;background:var(--light);display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;overflow:hidden}
.photo img{width:100%;display:block;border-radius:12px}
#cart{margin:12px 0}
.cartrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.x{background:none;color:var(--p);padding:0 10px;font-size:1.4rem;line-height:1.4}
.x:hover{background:var(--tint);color:var(--p)}
.les{margin:10px 0}
#viewer{position:fixed;inset:0;background:rgba(20,32,46,.9);z-index:20;padding:16px;display:flex;flex-direction:column;gap:8px}
#viewer[hidden]{display:none}
#viewer iframe{flex:1;border:0;background:#fff}
#dlg{position:fixed;inset:0;background:rgba(20,32,46,.75);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
#dlg[hidden]{display:none}
.atab.on,.srt.on{background:var(--tint)}
@media(max-width:800px){
.links{display:none;width:100%;flex-direction:column;padding-bottom:12px}nav.open .links{display:flex}.links a{margin:0;padding:10px 0}
#burger{display:block;position:fixed;top:14px;right:14px;z-index:6}
.art{height:380px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="atom" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.4"/></symbol><symbol id="sig" viewBox="0 0 24 24"><path d="M18 5H6l7 7-7 7h12"/></symbol><symbol id="cod" viewBox="0 0 24 24"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></symbol><symbol id="fla" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></symbol><symbol id="lea" viewBox="0 0 24 24"><path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15M5 19l8-8"/></symbol><symbol id="glo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol><symbol id="his" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10M10 21V10M14 21V10M19 21V10M3 10l9-6 9 6"/></symbol></defs></svg>
<button id="burger" aria-label="Menu">☰ Menu</button>
<nav id="nav"></nav>
<main id="main"></main>
<footer class="foot" id="foot"></footer>
<div id="viewer" hidden><div><button id="vclose">Close</button></div><iframe id="pdf" title="Document"></iframe></div>
<div id="dlg" hidden><div class="box"><p><b>Do you really want to cancel the lesson?</b></p><button id="yes">Yes</button> <button id="no" class="alt">No</button></div></div>

<script>
/* ============================================================

const CONFIG = {

  passwordHash: "53ce74aa431c724fe1a2d55e82c0b68a09d4b9705a4ab4399a356c2c950919ff",   // SHA-256 of the password of the subjects area. To change it: in the browser console run hashPw("newpassword").then(console.log)

    2: [["11:50–12:35", "12:40–13:25"], ["16:55–17:40"]],
    3: [["11:50–12:35", "12:40–13:25"], ["15:15–16:00"], ["16:05–16:50"], ["16:55–17:40"]],

/* ===================== from here on: the program ===================== */
const $ = s => document.querySelector(s);
const E = t => CONFIG.highlightEditable && /\[.*\]/.test(t) ? t.replace(/\[[^\]]*\]/g, m => `<span class="edit">${m}</span>`) : t;
const img = (src, alt = "") => `<img src="${src}" alt="${alt}" onerror="this.remove()">`;
const PAGES = [
  { id: "home", name: "Home" },
  { id: "overview", name: "My overview", blurb: "See and cancel your lessons" },
  { id: "booking", name: "Book a lesson", blurb: "Pick a free time slot" },
  { id: "about", name: "About me", blurb: "Who I am and what I know" },
  { id: "contact", name: "Contact", blurb: "Ask me a question" },
  { id: "subjects", name: "Subjects", blurb: "Material for my students" },
  { id: "prices", name: "Prices", blurb: "What a lesson costs" },
  { id: "admin", name: "Admin" }
];
const PARTS = [["theory", "Theory", "📖"], ["exercises", "Exercises", "✏️"], ["solutions", "Solutions", "✅"], ["exams", "Old exams", "📝"]];

document.title = CONFIG.brand;
const ICON = { physics: "atom", maths: "sig", cs: "cod", chemistry: "fla", biology: "lea", geography: "glo", history: "his" };
const ph = (src, style) => `<div class="ph" style="${style}"><img src="${src}" alt="" onerror="this.replaceWith('Your photo here')"></div>`;
const svg = (id, size = "") => `<svg class="ic" ${size ? `style="width:${size}px;height:${size}px" ` : ""}aria-hidden="true"><use href="#${id}"/></svg>`;
$("#nav").innerHTML = `<div class="logo">${img(CONFIG.logo, "")}<span>${CONFIG.brand}</span></div><div class="links">` +
  PAGES.map(p => `<a href="#${p.id}">${p.name}</a>`).join("") + `</div>`;
$("#foot").innerHTML = `${CONFIG.location} · <a href="mailto:${CONFIG.email}">${CONFIG.email}</a>`;

$("#main").innerHTML = `
<section id="home">
  <div class="w two" style="padding-top:48px;padding-bottom:72px">
    <div><p class="kick">One-to-one tutoring for teenagers</p><h1>${E(CONFIG.headline)}</h1>
      <p class="lead">${E(CONFIG.tagline)}</p><p><a class="btn lg" href="#booking">Book a lesson</a></p></div>
    <div class="art">
      <div class="dot" style="left:60px;top:40px;width:300px;height:300px;background:var(--p);color:#fff">${svg("atom", 120)}</div>
      <div class="dot" style="right:20px;top:0;width:120px;height:120px;background:var(--sand);color:var(--ink)">${svg("sig")}</div>
      <div class="dot" style="right:0;top:200px;width:150px;height:150px;background:var(--tint);color:var(--p)">${svg("cod")}</div>
      ${ph(CONFIG.hero, "position:absolute;left:0;bottom:0;width:250px;height:150px")}
    </div>
  </div>
  <div class="bg"><div class="w"><h2>My subjects</h2>
    <div class="g">${CONFIG.subjects.map(s => `<div class="t">${svg(ICON[s.id] || "atom")}<b>${s.name}</b></div>`).join("")}</div></div></div>
  <div class="sec w"><h2>Everything you need</h2>
    <div class="g">${PAGES.slice(1).filter(p => p.id !== "booking" && p.id !== "admin").map(p => `<a class="c" href="#${p.id}"><b>${p.name}</b><span>${p.blurb}</span></a>`).join("")}</div></div>
  <div class="bg"><div class="w"><h2>What others say</h2>
    <div class="g" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${CONFIG.reviews.map(r => `<div class="q"><p>“${E(r.text)}”</p><b>${E(r.name)}</b></div>`).join("")}</div></div></div>
  <div class="sec w two">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${ph(CONFIG.photos[0], "height:300px")}${ph(CONFIG.photos[1], "height:300px;margin-top:40px")}</div>
    <div><h2>Why should I pay for tutoring?</h2><ul>${CONFIG.why.map(w => `<li>${E(w)}</li>`).join("")}</ul></div>
  </div>
  <div class="w" style="padding-bottom:72px"><h2>Common questions</h2>
    ${CONFIG.faq.map(f => `<details><summary>${E(f.q)}</summary><p>${E(f.a)}</p></details>`).join("")}</div>
</section>

<section id="overview"><h2><span>My overview</span></h2>
  <form id="oform" class="box" style="max-width:420px">
    <label for="ou">Username</label><input id="ou" required autocomplete="username">
    <label for="oe">E-mail address</label><input id="oe" type="email" required autocomplete="email">
    <button>Show my lessons</button> <span id="omsg" class="msg" style="color:#b3261e"></span>
  </form>
  <div id="obox" hidden></div>
</section>

<section id="admin"><h2><span>Administration</span></h2>

      <label for="ae">Admin e-mail address (configured as ADMIN_EMAIL in Code.gs)</label><input id="ae" type="email" required autocomplete="username">

      <label for="ap">Password</label><input id="ap" type="password" required autocomplete="current-password">
      <button>Send me a code</button>
    </form>
    <form id="a2" class="box" style="max-width:420px" hidden>
      <label for="ac">6-digit code</label><input id="ac" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
      <button>Log in</button> <button type="button" class="alt" id="aresend">Send a new code</button>
    </form>
  </div>
  <p id="amsg" class="msg"></p>
  <div id="apanel" hidden><div class="row" id="atabs"></div><div id="aview"></div></div>
</section>

<section id="about"><h2><span>About me</span></h2>
  <div class="box about">
    <div class="photo"><img src="${CONFIG.photo}" alt="Photo of me" onerror="this.parentNode.innerHTML='<span class=edit>[✎ Your photo: add images/me.jpg]</span>'"></div>
    <ul style="flex:1 1 280px;margin:0">${CONFIG.about.bullets.map(b => `<li>${E(b)}</li>`).join("")}<li>Contact: <a href="mailto:${CONFIG.email}">${CONFIG.email}</a></li></ul>
  </div>
  <h3>More about me</h3><div class="box">${E(CONFIG.about.free)}</div>
</section>

<section id="contact"><h2><span>Ask me a question</span></h2>
  <form id="cform" class="box">
    <label for="cn">Your name</label><input id="cn" name="name" required>
    <label for="ce">Your e-mail address</label><input id="ce" name="email" type="email" required>
    <label for="cm">Your message</label><textarea id="cm" name="message" rows="5" required></textarea>
    <button>Send message</button> <span id="cmsg" class="msg"></span>
  </form>
</section>

<section id="subjects"><h2><span>Subject material</span></h2><div id="subjbox"></div></section>

<section id="prices"><h2><span>Prices</span></h2>
  <div class="box"><div class="price">${CONFIG.prices.perLesson} ${CONFIG.prices.currency}</div>per lesson (45 minutes)
  <ul>${CONFIG.prices.points.map(p => `<li>${E(p)}</li>`).join("")}</ul>
  <h3>Payment options</h3><ul>${CONFIG.prices.pay.map(p => `<li>${E(p)}</li>`).join("")}</ul>
  <h3>Location</h3><p>📍 ${CONFIG.location}</p></div>
</section>

<section id="booking"><h2><span>Book a lesson</span></h2>
  <div class="box">
    <p>📍 ${CONFIG.location}</p>
    <label for="date">Choose a day</label><input id="date" type="date" style="max-width:240px">
    <div id="slots" class="row"></div>
    <div id="bwarn" class="msg" style="color:#b3261e"></div>
    <div id="cart" class="box" hidden></div>
    <form id="bform" hidden>
      <label for="be">Your e-mail address</label><input id="be" name="email" type="email" required>
      <div id="newbox">
        <p class="small">First lesson: please fill in everything. Next time your e-mail address is enough.</p>
        <label for="bn">Your full name</label><input id="bn" name="name">
        <label for="bu">Username</label><input id="bu" name="username" autocomplete="username" pattern="[A-Za-z0-9_.-]{3,30}" title="3–30 letters, numbers, . _ or -">
        <label for="bc">Class</label><input id="bc" name="cls">
        <label for="bs">Preferred subject(s)</label><input id="bs" name="subjects">
        <p class="small" style="margin-top:-8px">Just name the main subject(s) you will be working on. That doesn’t mean we can’t look at any others.</p>
      </div>
      <label for="bm">Message (optional)</label><textarea id="bm" name="msg" rows="3"></textarea>
      <p><label><input type="checkbox" name="weekly" style="width:auto;margin:0 8px 0 0">Weekly lesson: reserve these time slots every week</label></p>
      <button>Book this lesson</button>
    </form>
    <p id="bmsg" class="msg"></p>
  </div>
  <p class="small">To cancel a lesson, open <a href="#overview">My overview</a>, log in with your username and e-mail address and press the × next to the lesson.</p>
</section>`;

/* ---------- menu / routing ---------- */
function go() {
  const id = PAGES.some(p => "#" + p.id === location.hash) ? location.hash.slice(1) : "home";
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.hash === "#" + id));
  $("#nav").classList.remove("open"); scrollTo(0, 0);
}
addEventListener("hashchange", go); go();
$("#burger").onclick = () => $("#nav").classList.toggle("open");

/* ---------- contact form: the message goes to the administration ---------- */
$("#cform").onsubmit = async e => {
  e.preventDefault();

/* ---------- password-protected subjects ---------- */
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
window.hashPw = sha;
function renderSubjects() {
  const box = $("#subjbox");
  if (sessionStorage.unlocked !== "1") {
    box.innerHTML = `<form id="pform" class="box" style="max-width:380px"><p>This area is for my students. Enter the password you received from me.</p>
      <label for="pw">Password</label><input id="pw" type="password" required><button>Open</button> <span id="pmsg" class="msg" style="color:#b3261e"></span></form>`;
    $("#pform").onsubmit = async e => {
      e.preventDefault();
      if (!CONFIG.passwordHash) { $("#pmsg").textContent = "No password has been set yet."; return; }
      if (await sha($("#pw").value) === CONFIG.passwordHash) { sessionStorage.unlocked = "1"; renderSubjects(); }
      else $("#pmsg").textContent = "Wrong password. Try again.";
    };
    return;
  }
  box.innerHTML = `<div class="row">${CONFIG.subjects.map((s, i) => `<button class="alt tab" data-i="${i}">${s.icon} ${s.name}</button>`).join("")}</div><div id="subj"></div>`;
  const show = i => {
    const s = CONFIG.subjects[i];
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", +t.dataset.i === i));
    $("#subj").innerHTML = `<div class="grid">${PARTS.map(([k, n, ic]) => `<div class="box"><h3>${ic} ${n}</h3>${
      s[k].length ? s[k].map(f => `<div class="row"><button class="alt" data-file="${f.file}">${f.title}</button></div>`).join("") : "<p>Nothing uploaded yet.</p>"}</div>`).join("")}</div>`;
  };
  box.querySelectorAll(".tab").forEach(t => t.onclick = () => show(+t.dataset.i));
  show(0);
}
renderSubjects();
$("#subjbox").addEventListener("click", e => {
  const f = e.target.dataset.file; if (!f) return;
  $("#pdf").src = f + "#toolbar=0&navpanes=0"; $("#viewer").hidden = false;   // opens in the browser only, no download button
});
$("#vclose").onclick = () => { $("#viewer").hidden = true; $("#pdf").src = "about:blank"; };
$("#viewer").oncontextmenu = e => e.preventDefault();

/* ---------- booking ---------- */
const api = {   // talks to the Google script (Code.gs)
  async list() {
    try { return await (await fetch(CONFIG.backendUrl)).json(); } catch (e) { return []; }
  },
  async send(data) {   // returns { ok, error, ... }
    try { return await (await fetch(CONFIG.backendUrl, { method: "POST", body: JSON.stringify(data) })).json(); }
    catch (e) { return { ok: false, error: "network" }; }
  }
};
const taken = (list, date, group) => list.some(b => b.group === group && (b.weekly ? date >= b.date && (!b.until || date < b.until) : b.date === date));
let cart = [];   // the chosen time slots: { date, g, t }
const todayStr = () => new Date().toLocaleDateString("sv-SE");
const nowHM = () => new Date().toTimeString().slice(0, 5);
const passed = (d, t) => d === todayStr() && t.slice(0, 5) <= nowHM();   // today’s lessons that already started
$("#date").min = todayStr();
const inCart = (d, t) => cart.some(c => c.date === d && c.t === t);
const dayName = d => new Date(d + "T12:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const warn = h => { $("#bwarn").innerHTML = h; };

function drawCart() {
  cart.sort((a, b) => (a.date + a.t).localeCompare(b.date + b.t));
  $("#cart").hidden = $("#bform").hidden = !cart.length;
  $("#cart").innerHTML = "<b>Your reserved time slots</b>" + cart.map((c, i) =>
    `<div class="cartrow"><span>${dayName(c.date)}, ${c.t}</span><button type="button" class="x" data-i="${i}" aria-label="Remove this time slot">×</button></div>`).join("");
}

async function showSlots() {
  const v = $("#date").value, box = $("#slots"); $("#bmsg").textContent = ""; warn("");
  if (!v) { box.innerHTML = ""; return; }
  const day = new Date(v + "T12:00").getDay(), groups = CONFIG.slots[day] || [];
  if (!groups.length) { box.innerHTML = "<p>No lessons are possible on this day. Please choose another day.</p>"; return; }
  const list = await api.list();
  box.innerHTML = groups.map((g, gi) => {
    const off = taken(list, v, day + "-" + gi);
    return `<div class="grp">${g.map(t => `<button type="button" class="slot${inCart(v, t) ? " sel" : ""}" ${off || passed(v, t) ? "disabled" : ""} data-g="${day}-${gi}" data-t="${t}">${t}</button>`).join("<i>or</i>")}</div>`;
  }).join("");
}
$("#date").onchange = showSlots;

// open the next day that still has a free lesson
async function openNextFree() {
  const list = await api.list();
  for (let n = 0; n < 120; n++) {
    const dt = new Date(); dt.setDate(dt.getDate() + n);
    const d = dt.toLocaleDateString("sv-SE"), day = dt.getDay();
    if ((CONFIG.slots[day] || []).some((g, gi) => !taken(list, d, day + "-" + gi) && g.some(t => !passed(d, t)))) { $("#date").value = d; return showSlots(); }
  }
}
openNextFree();

// message + the next free double lessons (two lessons in a row)
async function suggest(from) {
  const list = await api.list(), found = [];
  for (let n = 0; n < 90 && found.length < 3; n++) {
    const dt = new Date(from + "T12:00"); dt.setDate(dt.getDate() + n);
    const d = dt.toISOString().slice(0, 10), day = dt.getDay(), gs = CONFIG.slots[day] || [];
    const free = i => gs[i].length === 1 && !taken(list, d, day + "-" + i) && !inCart(d, gs[i][0]);
    for (let i = 0; i + 1 < gs.length && found.length < 3; i++)
      if (free(i) && free(i + 1)) found.push({ d, day, i, a: gs[i][0], b: gs[i + 1][0] });
  }
  warn("<p>You can’t book both midday lessons. " + (found.length ? "These are the next free double lessons you can choose:" : "There is no free double lesson in the next three months.") + "</p><div class=\"row\">" +
    found.map(f => `<button type="button" class="alt" data-d="${f.d}" data-ga="${f.day}-${f.i}" data-ta="${f.a}" data-gb="${f.day}-${f.i + 1}" data-tb="${f.b}">${dayName(f.d)}: ${f.a} + ${f.b}</button>`).join("") + "</div>");
}
$("#bwarn").onclick = async e => {
  const b = e.target.closest("[data-d]"); if (!b) return;
  const D = b.dataset;
  cart.push({ date: D.d, g: D.ga, t: D.ta }, { date: D.d, g: D.gb, t: D.tb });
  $("#date").value = D.d; await showSlots(); drawCart();
};

// click a time = choose it, click it again = remove it
$("#slots").onclick = e => {
  const b = e.target.closest(".slot"); if (!b || b.disabled) return;
  const d = $("#date").value, g = b.dataset.g, t = b.dataset.t;
  warn("");
  const i = cart.findIndex(c => c.date === d && c.t === t);
  if (i > -1) cart.splice(i, 1);
  else if (cart.some(c => c.date === d && c.g === g)) return suggest(d);   // both midday lessons
  else cart.push({ date: d, g, t });
  b.classList.toggle("sel", i < 0); drawCart();
};
// the little x in the list of reserved time slots
$("#cart").onclick = e => {
  const x = e.target.closest(".x"); if (!x) return;
  cart.splice(+x.dataset.i, 1); drawCart();
  document.querySelectorAll(".slot").forEach(s => s.classList.toggle("sel", inCart($("#date").value, s.dataset.t)));
};

const NEWF = ["bn", "bu", "bc", "bs"];
const setNew = v => { $("#newbox").hidden = !v; NEWF.forEach(id => $("#" + id).required = v); };
setNew(true);
$("#be").onchange = async () => {   // returning students only need their e-mail address
  if (!CONFIG.backendUrl || !$("#be").value.trim() || !$("#be").checkValidity()) return;
  const r = await api.send({ type: "known", email: $("#be").value.trim() });
  setNew(!(r.ok && r.known));
};

$("#bform").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target), weekly = f.get("weekly") === "on", name = f.get("name"), email = f.get("email"), msg = f.get("msg"), username = f.get("username"), cls = f.get("cls"), subjects = f.get("subjects");
  const slots = cart.map(c => ({ date: c.date, group: c.g, time: c.t })), done = cart.map(c => `${c.date}, ${c.t}`), out = $("#bmsg");
  const r = await api.send({ type: "booking", name, email, username, cls, subjects, msg, weekly, slots });
  if (!r.ok) {
    if (r.error === "taken") {
      alert("Sorry, one of your time slots was just booked by someone else. Please check your choice.");
      const list = await api.list(); cart = cart.filter(c => !taken(list, c.date, c.g)); drawCart(); return showSlots();
    }
    out.style.color = "#b3261e";
    if (r.error === "need_info") setNew(true);
    out.textContent = ({ need_info: "Please fill in all fields for your first lesson.", username_taken: "This username is already taken. Please choose another one.", bad_username: "The username needs 3–30 letters, numbers, . _ or -" })[r.error]
      || "Sorry, the booking could not be saved. Please try again or write to " + CONFIG.email + ".";
    return;
  }
  e.target.reset(); setNew(true); cart = []; drawCart(); await showSlots();
  out.style.color = "";
  out.textContent = `Booked: ${done.join(" and ")}${weekly ? " (every week)" : ""}. Thank you, ${name}!`;
};

/* ---------- lessons list: used by "My overview" and by the administration ---------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let me = null, pending = null;
const lessonText = l => l.weekly ? `Every ${new Date(l.date + "T12:00").toLocaleDateString("en-GB", { weekday: "long" })}, ${l.time} (weekly)` : `${dayName(l.date)}, ${l.time}`;
const WHY = `<div class="why" hidden><label>Reason for cancelling</label><textarea rows="3"></textarea><button type="button" class="go" disabled>Cancel the lesson</button> <span class="msg err" style="color:#b3261e"></span></div>`;
const lessonBox = l => l.status === "cancelled"
  ? `<div class="box les"><div class="cartrow"><span style="text-decoration:line-through">${lessonText(l)}</span><span class="small">cancelled${l.by === "admin" ? " by the tutor" : ""}${l.reason ? ": " + esc(l.reason) : ""}</span></div></div>`
  : `<div class="box les" data-id="${esc(l.id)}" data-date=""><div class="cartrow"><span>${lessonText(l)}</span><button type="button" class="x" aria-label="Cancel this lesson">×</button></div>${WHY}</div>`;

// × opens the question (Yes/No), then the reason field; the cancel button needs a reason
function bindCancel(box, send, done) {
  box.addEventListener("click", async e => {
    const les = e.target.closest(".les"); if (!les) return;
    if (e.target.closest(".x")) { pending = les; $("#dlg").hidden = false; }
    else if (e.target.closest(".go")) {
      const reason = les.querySelector("textarea").value.trim(); if (!reason) return;
      const b = e.target.closest(".go"); b.disabled = true;
      const r = await send(les.dataset, reason);
      if (r.ok) done(); else { les.querySelector(".err").textContent = "Cancelling failed. Please try again."; b.disabled = false; }
    }
  });
  box.addEventListener("input", e => { const w = e.target.closest(".why"); if (w) w.querySelector(".go").disabled = !e.target.value.trim(); });
}
$("#yes").onclick = () => {
  $("#dlg").hidden = true;
  if (pending) { const w = pending.querySelector(".why"); w.hidden = false; w.querySelector("textarea").focus(); }
};
$("#no").onclick = () => { $("#dlg").hidden = true; pending = null; };

/* ---------- my overview ---------- */
function drawLessons(r) {
  $("#obox").hidden = false;
  $("#obox").innerHTML = `<h3>Hello ${esc(r.name)}</h3><h3>Your booked lessons</h3>` + (r.lessons.length ? r.lessons.map(lessonBox).join("") : "<p>You have no upcoming lessons.</p>");
}
$("#oform").onsubmit = async e => {
  e.preventDefault();
  const out = $("#omsg"); out.textContent = ""; $("#obox").hidden = true;
  if (!CONFIG.backendUrl) { out.textContent = "The overview works as soon as the backend (Code.gs) is connected."; return; }
  const email = $("#oe").value.trim(), username = $("#ou").value.trim();
  const r = await api.send({ type: "overview", email, username });
  if (!r.ok) { out.textContent = r.error === "wrong" ? "Username and e-mail address do not match." : "Something went wrong. Please try again."; return; }
  me = { email, username }; drawLessons(r);
};
bindCancel($("#obox"), (d, reason) => api.send({ type: "cancel", ...me, id: d.id, reason }),
  async () => { const r = await api.send({ type: "overview", ...me }); if (r.ok) drawLessons(r); showSlots(); });

/* ---------- administration ---------- */
let tok = sessionStorage.adm || "", lg = null, cur = "messages", sortBy = "date", LS = [], blockSel = [], curStudent = "";
const aMsg = t => { $("#amsg").textContent = t; };
const aErr = r => ({
  locked: "Too many attempts. Please try again in 15 minutes.",
  wrong: "E-mail address or password is wrong.",
  code: "The code is wrong.",
  expired: "The code has expired. Please log in again.",
  server: "The script reported an error" + (r.detail ? ": " + r.detail : "") + ". See Apps Script > Executions.",
  network: "No valid answer from the script. Check backendUrl, that the deployment is set to “Anyone” and that you deployed a new version.",
  invalid: "The script is outdated. In Apps Script use Deploy > Manage deployments > pencil > New version > Deploy."
})[r.error] || "Login failed (" + r.error + ").";
const showLogin = () => { $("#alogin").hidden = false; $("#apanel").hidden = true; $("#a1").hidden = false; $("#a2").hidden = true; };
async function A(action, data = {}) {
  const r = await api.send({ type: "admin", token: tok, action, ...data });
  if (r.error === "auth") { tok = ""; sessionStorage.removeItem("adm"); showLogin(); aMsg("Please log in again."); }
  return r;
}
function showPanel() { $("#alogin").hidden = true; $("#apanel").hidden = false; aTab("messages"); }
$("#a1").onsubmit = async e => {
  e.preventDefault(); aMsg("");
  if (!CONFIG.backendUrl) return aMsg("The administration works as soon as the backend (Code.gs) is connected.");
  let v = null;   // is the deployed script up to date? An old one would count this try as a wrong password
  try { v = await (await fetch(CONFIG.backendUrl + "?v=1")).json(); } catch (err) {}
  if (!v || !(v.version >= 8)) return aMsg(aErr({ error: v ? "invalid" : "network" }));
  lg = { email: $("#ae").value.trim(), password: $("#ap").value };
  const r = await api.send({ type: "adminLogin", ...lg });
  if (!r.ok) return aMsg(aErr(r));
  $("#a1").hidden = true; $("#a2").hidden = false;
  aMsg(r.sent ? `A new 6-digit code was sent to ${r.to} (via ${r.via}). Please also look in the spam folder. Safety net: the code is also in the tab “Login” of your Google Sheet.`
              : `The e-mail could not be sent (${r.detail}). The code is in the tab “Login” of your Google Sheet.`);
};
$("#aresend").onclick = () => $("#a1").requestSubmit();
$("#a2").onsubmit = async e => {
  e.preventDefault();
  const r = await api.send({ type: "adminVerify", ...lg, code: $("#ac").value.trim() });
  if (!r.ok) return aMsg(aErr(r));
  tok = r.token; sessionStorage.adm = tok; $("#a1").reset(); $("#a2").reset(); aMsg(""); showPanel();
};
const TABS = [["messages", "Messages"], ["lessons", "Lessons"], ["students", "Students"], ["bills", "Bills"], ["block", "Block lessons"]];
$("#atabs").innerHTML = TABS.map(([k, n]) => `<button class="alt atab" data-k="${k}">${n}</button>`).join("") + `<button class="alt" id="alogout">Log out</button>`;
$("#atabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "alogout") { tok = ""; sessionStorage.removeItem("adm"); showLogin(); } else aTab(b.dataset.k);
};
function aTab(k) {
  cur = k; document.querySelectorAll(".atab").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  ({ messages: vMessages, lessons: vLessons, students: vStudents, bills: vBills, block: vBlock })[k]();
}

async function vMessages() {
  const r = await A("messages"); if (!r.ok) return;
  $("#aview").innerHTML = r.items.length ? r.items.map(m => `<div class="box" style="margin:10px 0"><b>${esc(m.name)}</b> · <a href="mailto:${esc(m.email)}">${esc(m.email)}</a> <span class="small">${esc(m.created)}</span><p style="margin:8px 0 0">${esc(m.message)}</p></div>`).join("") : "<p>No messages yet.</p>";
}

const aRow = l => {
  const dead = l.status === "cancelled";
  return `<div class="box les" data-id="${esc(l.id)}" data-date="${l.date}"><div class="cartrow"><span${dead ? ' style="text-decoration:line-through"' : ""}>${l.date} · ${l.time} · ${esc(l.name)}${l.weekly ? " (weekly)" : ""}</span>` +
    (dead ? `<span class="small">cancelled${l.by ? " by " + l.by : ""}${l.reason ? ": " + esc(l.reason) : ""}</span>` : `<button type="button" class="x" aria-label="Cancel this lesson">×</button>`) + `</div>` +
    (dead ? "" : WHY + (l.blocked ? "" : `<div class="row"><input class="note" style="flex:1;margin:0" placeholder="What did we do in this lesson?" value="${esc(l.notes)}" data-key="${esc(l.key)}"><button type="button" class="alt" data-act="note">Save</button></div>`)) + `</div>`;
};
async function vLessons(fresh = true) {
  if (fresh) { const r = await A("lessons"); if (!r.ok) return; LS = r.items; }
  const key = l => l.date + l.time, arr = [...LS].sort((a, b) => sortBy === "name" ? a.name.localeCompare(b.name) || key(a).localeCompare(key(b)) : key(a).localeCompare(key(b)));
  $("#aview").innerHTML = `<div class="row"><span>Sort by:</span><button class="alt srt${sortBy === "date" ? " on" : ""}" data-act="sort" data-v="date">Date</button><button class="alt srt${sortBy === "name" ? " on" : ""}" data-act="sort" data-v="name">Name</button></div>` +
    (arr.length ? arr.map(aRow).join("") : "<p>No lessons yet.</p>");
}

async function vStudents() {
  const r = await A("students"); if (!r.ok) return;
  $("#aview").innerHTML = (r.items.length ? `<div class="row">${r.items.map(s => `<button class="alt" data-act="student" data-e="${esc(s.email)}">${esc(s.name)}</button>`).join("")}</div>` : "<p>No students yet.</p>") + `<div id="sdet"></div>`;
  curStudent = "";
}
async function openStudent(email) {
  curStudent = email;
  const r = await A("student", { email }); if (!r.ok) return;
  const i = r.info;
  $("#sdet").innerHTML = `<h3>${esc(i.name)}</h3><div class="box"><ul style="margin:0"><li>Username: ${esc(i.username)}</li><li>E-mail address: ${esc(i.email)}</li><li>Class: ${esc(i.cls)}</li><li>Preferred subject(s): ${esc(i.subjects)}</li></ul></div><h3>Booked lessons</h3>` +
    (r.lessons.length ? r.lessons.map(lessonBox).join("") : "<p>No upcoming lessons.</p>");
}

async function vBills() {
  const r = await A("bills"); if (!r.ok) return;
  $("#aview").innerHTML = r.items.length ? r.items.map(b => `<div class="box" style="margin:12px 0"><h3 style="margin-top:0">${esc(b.name)}</h3>` +
    b.lessons.map(l => `<div class="cartrow"><span>${l.date} · ${l.time}${l.notes ? " · " + esc(l.notes) : ""}</span><b>${l.free ? "free" : l.price + " CHF"}</b></div>`).join("") +
    `<p><b>Total: ${b.total} CHF</b> <button type="button" data-act="pay" data-keys="${esc(JSON.stringify(b.lessons.map(l => l.key)))}">Mark all as paid</button></p></div>`).join("") : "<p>No unpaid lessons.</p>";
}

function vBlock() {
  blockSel = [];
  $("#aview").innerHTML = `<div class="box"><label for="kdate">Choose a day</label><input id="kdate" type="date" min="${todayStr()}" style="max-width:240px"><div id="kslots" class="row"></div></div>
    <div id="ksel" class="box" style="margin:12px 0"></div>
    <button type="button" data-act="kgo">Block the selected lessons</button> <span id="kmsg" class="msg"></span>`;
  drawKsel();
}
function drawKsel() {
  blockSel.sort((a, b) => (a.date + a.t).localeCompare(b.date + b.t));
  $("#ksel").innerHTML = blockSel.length ? "<b>Selected lessons</b>" + blockSel.map((c, i) => `<div class="cartrow"><span>${dayName(c.date)}, ${c.t}</span><button type="button" class="x" data-act="kx" data-i="${i}" aria-label="Remove this lesson">×</button></div>`).join("") : '<span class="small">No lessons selected yet.</span>';
}
async function kSlots() {
  const v = $("#kdate").value, box = $("#kslots"); if (!v) { box.innerHTML = ""; return; }
  const day = new Date(v + "T12:00").getDay(), gs = CONFIG.slots[day] || [];
  if (!gs.length) { box.innerHTML = "<p>No lessons on this day.</p>"; return; }
  const list = await api.list();
  box.innerHTML = gs.map((g, gi) => { const off = taken(list, v, day + "-" + gi);
    return `<div class="grp">${g.map(t => `<button type="button" class="slot${blockSel.some(c => c.date === v && c.t === t) ? " sel" : ""}" ${off || passed(v, t) ? "disabled" : ""} data-act="kslot" data-g="${day}-${gi}" data-t="${t}">${t}</button>`).join("<i>or</i>")}</div>`; }).join("");
}

bindCancel($("#aview"), (d, reason) => A("cancel", { id: d.id, date: d.date, reason }), () => cur === "students" && curStudent ? openStudent(curStudent) : aTab(cur));
$("#aview").addEventListener("change", e => { if (e.target.id === "kdate") kSlots(); });
$("#aview").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const D = b.dataset;
  if (D.act === "sort") { sortBy = D.v; vLessons(false); }
  else if (D.act === "note") { const inp = b.previousElementSibling; const r = await A("note", { key: inp.dataset.key, notes: inp.value }); b.textContent = r.ok ? "Saved" : "Failed"; setTimeout(() => b.textContent = "Save", 1500); }
  else if (D.act === "student") openStudent(D.e);
  else if (D.act === "pay") { if (confirm("Mark these lessons as paid?")) { const r = await A("pay", { keys: JSON.parse(D.keys) }); if (r.ok) vBills(); } }
  else if (D.act === "kslot") {
    const d = $("#kdate").value, i = blockSel.findIndex(c => c.date === d && c.g === D.g), same = i > -1 && blockSel[i].t === D.t;   // one lesson per time group
    if (i > -1) blockSel.splice(i, 1);
    if (!same) blockSel.push({ date: d, g: D.g, t: D.t });
    kSlots(); drawKsel();
  }
  else if (D.act === "kx") { blockSel.splice(+D.i, 1); drawKsel(); kSlots(); }
  else if (D.act === "kgo") {
    if (!blockSel.length) return;
    const r = await A("block", { slots: blockSel.map(c => ({ date: c.date, group: c.g, time: c.t })) });
    if (r.ok) { blockSel = []; drawKsel(); kSlots(); $("#kmsg").textContent = "The selected lessons are blocked."; }
    else $("#kmsg").textContent = r.error === "taken" ? "One of the lessons is already taken." : "Blocking failed. Please try again.";
  }
});
if (tok && CONFIG.backendUrl) showPanel();
</script></body></html>
